[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-mem"
version = "0.1.0"
description = "The Persistent Agent Memory & Knowledge Graph Engine for Google AI & Gemini Advanced subscribers."
readme = "README.md"
authors = [{ name = "jdymitarai" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
gemini-mem = "gemini_mem.cli:main"

[project.urls]
Homepage = "https://github.com/jdymitarai/gemini-mem"
Repository = "https://github.com/jdymitarai/gemini-mem"
Issues = "https://github.com/jdymitarai/gemini-mem/issues"
