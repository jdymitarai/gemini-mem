<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gemini-mem // Google AI Agent Knowledge Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-variant: #1c2742;
      --primary: #4285f4;
      --secondary: #34a853;
      --accent: #fbbc05;
      --error: #ea4335;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: #2a3b5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand-spark {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(66, 133, 244, 0.15);
      color: var(--primary);
      border: 1px solid rgba(66, 133, 244, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-drive {
      background: rgba(52, 168, 83, 0.15);
      color: var(--secondary);
      border: 1px solid rgba(52, 168, 83, 0.3);
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }
    .canvas-panel {
      flex: 1.3;
      position: relative;
      background: radial-gradient(circle at center, #131b2e 0%, #0b0f19 100%);
      border-right: 1px solid var(--border);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .canvas-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
    }
    .canvas-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .feed-panel {
      flex: 1;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface-variant);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--primary); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-type {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .card-time { font-size: 0.75rem; color: var(--text-muted); }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
    .facts-list {
      margin-top: 8px;
      padding-left: 16px;
      font-size: 0.8rem;
      color: #bcc5d4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-spark">✦ gemini-mem</span>
      <span class="badge">Google AI Persistent Cortex</span>
      <span class="badge badge-drive" id="driveStatus">Google One 2TB Sync: Checking...</span>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-val" id="statObs">0</span>
        <span class="stat-lbl">Observations</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="statNodes">0</span>
        <span class="stat-lbl">Graph Nodes</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="statRels">0</span>
        <span class="stat-lbl">Synapses</span>
      </div>
      <button class="btn" onclick="triggerSync()">Sync to Drive</button>
    </div>
  </header>

  <main>
    <div class="canvas-panel">
      <div class="canvas-overlay">
        <div class="canvas-title">Neural Knowledge Graph</div>
      </div>
      <canvas id="graphCanvas"></canvas>
    </div>

    <div class="feed-panel">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Search memory facts, bugfixes, architectural decisions..." oninput="onSearch(this.value)">
      </div>
      <div class="feed-list" id="feedList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <script>
    let graphData = { entities: [], relations: [] };
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let nodes = [];
    let links = [];

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('statObs').innerText = data.total_observations;
        document.getElementById('statNodes').innerText = data.total_entities;
        document.getElementById('statRels').innerText = data.total_relations;
        const driveBadge = document.getElementById('driveStatus');
        if (data.drive_sync && data.drive_sync.available) {
          driveBadge.innerText = 'Google One 2TB Sync: Active';
        } else {
          driveBadge.innerText = 'Google One Sync: Local Ready';
        }
      } catch (e) {}
    }

    async function loadGraph() {
      try {
        const res = await fetch('/api/graph');
        graphData = await res.json();
        initPhysics();
      } catch (e) {}
    }

    async function loadFeed(query = '') {
      try {
        const url = query ? `/api/observations?q=${encodeURIComponent(query)}` : '/api/observations';
        const res = await fetch(url);
        const list = await res.json();
        const container = document.getElementById('feedList');
        container.innerHTML = '';
        if (list.length === 0) {
          container.innerHTML = '<div style="color:var(--text-muted);padding:24px;text-align:center;">No memory records found. Active sessions will populate memories here.</div>';
          return;
        }
        list.forEach(o => {
          const card = document.createElement('div');
          card.className = 'card';
          const factsHtml = o.facts && o.facts.length ? `<ul class="facts-list">${o.facts.map(f => `<li>${f}</li>`).join('')}</ul>` : '';
          card.innerHTML = `
            <div class="card-header">
              <span class="card-type">${o.type}</span>
              <span class="card-time">${o.created_at}</span>
            </div>
            <div class="card-title">${o.title}</div>
            <div class="card-desc">${o.narrative || ''}</div>
            ${factsHtml}
          `;
          container.appendChild(card);
        });
      } catch (e) {}
    }

    function initPhysics() {
      nodes = (graphData.entities || []).map((e, idx) => ({
        id: e.name,
        type: e.entity_type,
        x: canvas.width / 2 + (Math.random() - 0.5) * 300,
        y: canvas.height / 2 + (Math.random() - 0.5) * 300,
        vx: 0,
        vy: 0,
        radius: 12 + Math.min(e.observations.length * 2, 10)
      }));

      links = (graphData.relations || []).map(r => ({
        source: r.source,
        target: r.target,
        type: r.relation_type
      }));
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Simple spring layout
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[j].x - nodes[i].x;
          const dy = nodes[j].y - nodes[i].y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 180) {
            const force = (180 - dist) / 180 * 0.2;
            nodes[i].vx -= (dx / dist) * force;
            nodes[i].vy -= (dy / dist) * force;
            nodes[j].vx += (dx / dist) * force;
            nodes[j].vy += (dy / dist) * force;
          }
        }
      }

      links.forEach(l => {
        const s = nodes.find(n => n.id === l.source);
        const t = nodes.find(n => n.id === l.target);
        if (s && t) {
          const dx = t.x - s.x;
          const dy = t.y - s.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = (dist - 100) * 0.005;
          s.vx += (dx / dist) * force;
          s.vy += (dy / dist) * force;
          t.vx -= (dx / dist) * force;
          t.vy -= (dy / dist) * force;

          ctx.strokeStyle = 'rgba(66, 133, 244, 0.25)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(t.x, t.y);
          ctx.stroke();
        }
      });

      nodes.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;
        n.vx *= 0.85;
        n.vy *= 0.85;

        // Keep inside bounds
        n.x = Math.max(30, Math.min(canvas.width - 30, n.x));
        n.y = Math.max(30, Math.min(canvas.height - 30, n.y));

        ctx.fillStyle = n.type === 'Concept' ? '#4285f4' : '#34a853';
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '11px Google Sans';
        ctx.textAlign = 'center';
        ctx.fillText(n.id, n.x, n.y - n.radius - 4);
      });

      requestAnimationFrame(animate);
    }

    let searchTimer = null;
    function onSearch(val) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadFeed(val), 200);
    }

    async function triggerSync() {
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const data = await res.json();
        alert(data.status === 'success' ? 'Synchronized to Google Drive!' : 'Sync triggered.');
        loadStats();
      } catch (e) {
        alert('Sync error: ' + e);
      }
    }

    loadStats();
    loadGraph();
    loadFeed();
    animate();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
